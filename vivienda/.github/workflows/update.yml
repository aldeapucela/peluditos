name: Actualizar datos y avisar

# Una vez al día: lee las fichas oficiales, detecta lo que ha cambiado, avisa
# por correo de lo que corresponda y publica. Si algo falla antes del envío, no
# se manda nada: es preferible un aviso tarde que un aviso falso.

on:
  schedule:
    - cron: '30 6 * * *'   # 06:30 UTC, best-effort: GitHub lo retrasa a menudo
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pruebas (parser, avisos, correo, privacidad)
        run: npm test

      - name: Leer las fichas oficiales
        run: node scripts/sync.mjs

      - name: Detectar novedades y plazos que se acercan
        run: node scripts/avisos.mjs

      - name: Test de privacidad
        run: node scripts/check-privacidad.mjs

      - name: Avisar por correo
        # Sin secretos configurados no envía nada y no falla: el resto del
        # sistema (web, RSS y calendario) sigue funcionando igual.
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_SEGURO: ${{ secrets.SMTP_SEGURO }}
          AVISOS_DE: ${{ secrets.AVISOS_DE }}
          AVISOS_PARA: ${{ secrets.AVISOS_PARA }}
          AVISOS_URGENCIA: ${{ vars.AVISOS_URGENCIA }}
        run: node scripts/notificar.mjs

      - name: Commitear si hay cambios
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- data/; then
            echo "sin cambios en data/"
          else
            git add data/
            git commit -m "Actualizar datos ($(date -u +%Y-%m-%d))"
            git push
          fi

      - name: Generar el sitio
        run: node scripts/build.mjs

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - id: deploy
        uses: actions/deploy-pages@v4
