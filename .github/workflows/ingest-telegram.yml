name: Ingesta Telegram (subtema Peluditos)

# Cada hora revisa el subtema "Peluditos" del grupo @AldeaPucela y publica en la web las
# fotos con #webPeluditos (o las que un admin apruebe respondiendo con ese hashtag).
# Requisitos del bot: privacy mode desactivado (o admin) y SIN webhook (usa getUpdates).

on:
  schedule:
    - cron: '0 * * * *'   # cada hora en punto
  workflow_dispatch:       # lanzable a mano para pruebas

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Ingerir de Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # clasifica animal/tipo; si falta, lo hace el fetch diario
          CLASSIFY_FAST: '1'
        run: node scripts/ingest-telegram.mjs
      - name: Publicar cambios
        id: commit
        run: |
          git config user.name "peluditos-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data/posts.json img
          if git diff --staged --quiet; then
            echo "Sin cambios que publicar"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Ingesta Telegram ($(date -u +'%F %H:%M'))"
            git pull --rebase origin main || true
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # Solo desplegamos si hubo publicaciones nuevas (el push del job anterior usa GITHUB_TOKEN
  # y NO dispara deploy-pages.yml por la regla anti-recursión de GitHub).
  deploy:
    needs: ingest
    if: needs.ingest.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
